name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 检查版本号是否变更
  detect-version-change:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version_name: ${{ steps.check.outputs.version_name }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Detect version change
        id: check
        run: |
          CHANGED="false"
          # 检查是否有上一个提交（避免首次提交时 HEAD~1 不存在）
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            # 对比当前和上一次提交，检测 versionName 或 versionCode 是否变更
            DIFF=$(git diff HEAD~1 HEAD -- app/build.gradle.kts || true)
            if echo "$DIFF" | grep -qE 'versionName\s*=|versionCode\s*='; then
              CHANGED="true"
              echo "Detected version change in build.gradle.kts"
              echo "$DIFF" | grep -E 'versionName|versionCode' || true
            fi
          else
            echo "No previous commit found (initial push), skipping version diff"
          fi

          # 读取当前版本信息
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/')

          echo "version_changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Current: versionName=$VERSION_NAME versionCode=$VERSION_CODE changed=$CHANGED"

  # Debug 构建：每次 main 分支推送都会执行
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure nested taglib submodule (taglib/taglib + utfcpp) are synced
        run: |
          # actions/checkout 的 recursive 有时无法初始化嵌套 submodule（相对 URL / 嵌套层级 2+）
          # 这里显式 sync + init --recursive 并做回退克隆
          git -C third-party/taglib submodule sync
          git -C third-party/taglib submodule update --init --recursive || true

          TAGLIB_DIR="third-party/taglib/src/main/cpp/taglib"
          # 若嵌套 taglib CMakeLists 仍缺失，直接从官方仓库克隆指定 commit 78298769de7485850613b0589d70503b8a8fc81c
          if [ ! -f "$TAGLIB_DIR/CMakeLists.txt" ]; then
            echo "Nested taglib submodule missing, fallback clone..."
            rm -rf "$TAGLIB_DIR"
            git clone --depth 1 --no-checkout https://github.com/taglib/taglib.git "$TAGLIB_DIR"
            git -C "$TAGLIB_DIR" fetch --depth 1 origin 78298769de7485850613b0589d70503b8a8fc81c
            git -C "$TAGLIB_DIR" checkout 78298769de7485850613b0589d70503b8a8fc81c
            # utfcpp 是 taglib 的 3rdparty 嵌套 submodule，也需要补齐
            if [ ! -d "$TAGLIB_DIR/3rdparty/utfcpp/utf8" ]; then
              rm -rf "$TAGLIB_DIR/3rdparty/utfcpp"
              git clone --depth 1 --no-checkout https://github.com/nemtrif/utfcpp.git "$TAGLIB_DIR/3rdparty/utfcpp"
              git -C "$TAGLIB_DIR/3rdparty/utfcpp" fetch --depth 1 origin df857efc5bbc2aa84012d865f7d7e9cccdc08562
              git -C "$TAGLIB_DIR/3rdparty/utfcpp" checkout df857efc5bbc2aa84012d865f7d7e9cccdc08562
            fi
          fi
          ls "$TAGLIB_DIR/CMakeLists.txt"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew app:assembleNormalDebug

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/normal/debug/*.apk
          retention-days: 14

      - name: Upload Debug Build Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-outputs-${{ github.run_number }}
          path: app/build/outputs/
          retention-days: 3

  # Release 构建：仅当版本号变更时执行，上传至 GitHub Releases
  build-release:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure nested taglib submodule (taglib/taglib + utfcpp) are synced
        run: |
          git -C third-party/taglib submodule sync
          git -C third-party/taglib submodule update --init --recursive || true

          TAGLIB_DIR="third-party/taglib/src/main/cpp/taglib"
          if [ ! -f "$TAGLIB_DIR/CMakeLists.txt" ]; then
            echo "Nested taglib submodule missing, fallback clone..."
            rm -rf "$TAGLIB_DIR"
            git clone --depth 1 --no-checkout https://github.com/taglib/taglib.git "$TAGLIB_DIR"
            git -C "$TAGLIB_DIR" fetch --depth 1 origin 78298769de7485850613b0589d70503b8a8fc81c
            git -C "$TAGLIB_DIR" checkout 78298769de7485850613b0589d70503b8a8fc81c
            if [ ! -d "$TAGLIB_DIR/3rdparty/utfcpp/utf8" ]; then
              rm -rf "$TAGLIB_DIR/3rdparty/utfcpp"
              git clone --depth 1 --no-checkout https://github.com/nemtrif/utfcpp.git "$TAGLIB_DIR/3rdparty/utfcpp"
              git -C "$TAGLIB_DIR/3rdparty/utfcpp" fetch --depth 1 origin df857efc5bbc2aa84012d865f7d7e9cccdc08562
              git -C "$TAGLIB_DIR/3rdparty/utfcpp" checkout df857efc5bbc2aa84012d865f7d7e9cccdc08562
            fi
          fi
          ls "$TAGLIB_DIR/CMakeLists.txt"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare local.properties (API keys)
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          GOOGLE_PLAY_LICENSE_KEY: ${{ secrets.GOOGLE_PLAY_LICENSE_KEY }}
          BUGLY_APP_ID: ${{ secrets.BUGLY_APP_ID }}
          BUGLY_APP_KEY: ${{ secrets.BUGLY_APP_KEY }}
        run: |
          cat > local.properties <<EOF
          LASTFM_API_KEY=${LASTFM_API_KEY:-""}
          GOOGLE_PLAY_LICENSE_KEY=${GOOGLE_PLAY_LICENSE_KEY:-""}
          BUGLY_APP_ID=${BUGLY_APP_ID:-""}
          BUGLY_APP_KEY=${BUGLY_APP_KEY:-""}
          EOF

      - name: Build Release APK
        run: ./gradlew :app:assembleNormalRelease

      - name: Collect Release APKs
        id: apks
        run: |
          APK_DIR="app/build/outputs/apk/normal/release"
          echo "APK files in $APK_DIR:"
          ls -la "$APK_DIR"/*.apk || true
          # 使用通配符匹配所有apk，软发布动作会自动处理
          echo "apk_path=$APK_DIR/*.apk" >> $GITHUB_OUTPUT

      - name: Generate Release Changelog
        id: changelog
        run: |
          TAG_NAME="v${{ needs.detect-version-change.outputs.version_name }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          # 使用最近提交记录作为changelog
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" -n 20 2>/dev/null || echo "- Automated release")
          {
            echo "body<<EOF"
            echo "## Version ${{ needs.detect-version-change.outputs.version_name }} (Code: ${{ needs.detect-version-change.outputs.version_code }})"
            echo ""
            echo "Automated release triggered by version change in app/build.gradle.kts"
            echo ""
            echo "### Commits"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Check if release tag exists
        id: tag_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ needs.detect-version-change.outputs.version_name }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete old release if exists
        if: steps.tag_check.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ needs.detect-version-change.outputs.version_name }}"
          gh release delete "$TAG_NAME" --cleanup-tag --yes || true
          git push origin :refs/tags/"$TAG_NAME" || true

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.detect-version-change.outputs.version_name }}
          name: Release v${{ needs.detect-version-change.outputs.version_name }}
          files: ${{ steps.apks.outputs.apk_path }}
          prerelease: false
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ needs.detect-version-change.outputs.version_name }}
          path: app/build/outputs/apk/normal/release/*.apk
          retention-days: 90

      - name: Upload Build Outputs (logs, mapping etc.)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-outputs-${{ github.run_number }}
          path: app/build/outputs/
          retention-days: 14
